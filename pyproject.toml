[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldenbird"
version = "0.1.0"
description = "Goldenbird Capital — India markets research desk builders and storage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Goldenbird Capital" }]
dependencies = [
  "python-dotenv>=1.0.0",
  "boto3>=1.34.0",
  "requests>=2.28.0",
  "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]
market = [
  "kiteconnect>=4.2.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pandas-ta>=0.3.14b",
]

[project.scripts]
gb-r2-upload-ui = "goldenbird.cli.upload_ui:main"
gb-r2-enable-public = "goldenbird.cli.enable_r2_public:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
