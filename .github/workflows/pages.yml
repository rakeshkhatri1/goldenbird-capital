name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p _site/data _site/examples
          cp index.html _site/index.html
          cp site/config.js _site/config.js
          if [ -d site/data ]; then cp -R site/data/. _site/data/; fi
          if [ -d examples ]; then cp -R examples/. _site/examples/; fi
          # Optional extras that are safe to publish
          if [ -f cost-vectors.html ]; then cp cost-vectors.html _site/; fi
          if [ -f global-atlas.html ]; then cp global-atlas.html _site/; fi
          find _site -type f | sort | head -50
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
